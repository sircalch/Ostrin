name: Verify Ostrin website
description: Build the real WASM compiler, run static checks and test the site across Chromium, Firefox and WebKit.
runs:
  using: composite
  steps:
    - name: Install Rust with the WASI target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: tests/browser/package-lock.json
    - name: Install browser test dependencies
      shell: bash
      working-directory: tests/browser
      run: npm ci
    - name: Install browser engines and operating-system dependencies
      shell: bash
      working-directory: tests/browser
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Generate public evidence dashboard
      shell: bash
      run: |
        node scripts/quality-scorecard.mjs --write
        node scripts/status-page.mjs --write
    - name: Build compiler WASM and run browser regressions
      shell: bash
      working-directory: tests/browser
      run: npm test
    - name: Upload browser failure artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ostrin-playwright-failures-${{ github.run_id }}
        path: |
          /tmp/ostrin-playwright-results
          tests/browser/test-results
        if-no-files-found: ignore
    - name: Capture CI host provenance and regenerate experiment bundles
      shell: bash
      env:
        OSTRIN_CAPTURE_HOST: "1"
      run: |
        node scripts/experiment-bundle.mjs --write-all
        node scripts/r3-readiness.mjs --write --require-capture
        node scripts/quality-scorecard.mjs --write
        node scripts/status-page.mjs --write
    - name: Validate website, WASM and distribution contracts
      shell: bash
      env:
        OSTRIN_CAPTURE_HOST: "1"
      run: |
        node scripts/linguist-check.mjs
        node --test scripts/linguist-check.test.mjs
        node scripts/project-plan-check.mjs
        node scripts/fallback-ledger-check.mjs
        node scripts/r3-readiness.mjs --require-capture
        node --test scripts/r3-readiness.test.mjs
        node --test scripts/quality-scorecard.test.mjs
        node --test scripts/project-plan-check.test.mjs
        node --test scripts/v0.2-readiness-check.test.mjs
        node scripts/measurement-contract-check.mjs
        node --test scripts/measurement-contract-check.test.mjs
        node scripts/quantity-ownership-check.mjs
        node --test scripts/quantity-ownership-check.test.mjs
        node scripts/website-metadata.mjs
        node --no-warnings scripts/lab-data.mjs --verify-replays
        node --test scripts/lab-data-replay.test.mjs
        node scripts/experiment-replay.mjs --all
        node --test scripts/experiment-replay.test.mjs
        node scripts/viz-jsonld.mjs
        node scripts/experiment-bundle.mjs
        node --test scripts/experiment-bundle.test.mjs
        node scripts/provenance-page.mjs --check
        node scripts/website-check.mjs --wasm
        node scripts/distribution-check.mjs
    - name: Upload verified host-bound R3 evidence
      uses: actions/upload-artifact@v4
      with:
        name: ostrin-r3-host-evidence-${{ github.run_id }}
        path: |
          validation/r3-readiness.json
          validation/quality-scorecard.json
          website/status-data.js
          website/assets/experiments/*.ostrin-experiment.json
        if-no-files-found: error
        retention-days: 90
