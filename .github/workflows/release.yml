name: Ostrin Release

# Builds ostrinc for Linux, macOS and Windows when a version tag is pushed and
# attaches the archives plus SHA-256 checksums to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ostrinc
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ostrinc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ostrinc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        env:
          OSTRIN_REQUIRE_CC: "1"
        run: cargo test --release --manifest-path compiler/Cargo.toml --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path compiler/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="ostrinc-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "compiler/target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name/"
          cp LICENSE README.md "$name/"
          cp -r examples "$name/examples"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
