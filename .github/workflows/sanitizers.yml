name: Native sanitizers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ostrin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  address:
    name: AddressSanitizer native suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSTRIN_CC: clang
      OSTRIN_CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      OSTRIN_REQUIRE_CC: "1"
      # Keep compiler-level live-allocation assertions and process-wide
      # LeakSanitizer checks enabled together for the generated native programs.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install --yes clang
      - name: Run native examples under sanitizers
        run: cargo test --manifest-path compiler/Cargo.toml --test examples -- --test-threads=1
      - name: Run generated differential corpus under AddressSanitizer
        env:
          # Keep this larger than the matrix smoke corpus so generated
          # ownership paths are exercised with ASan as well as leak-check.
          OSTRIN_FUZZ_SEEDS: "16"
        run: cargo test --manifest-path compiler/Cargo.toml --test examples generated_ -- --test-threads=1
      - name: Run front-end fuzz checks
        env:
          OSTRIN_FUZZ_ROUNDS: "8"
        run: cargo test --manifest-path compiler/Cargo.toml --test differential -- --skip every_example_agrees_between_interpreter_and_native
  undefined:
    name: UBSan native suite
    runs-on: ubuntu-latest
    env:
      OSTRIN_CC: clang
      OSTRIN_CFLAGS: "-fsanitize=undefined -fno-omit-frame-pointer"
      OSTRIN_REQUIRE_CC: "1"
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install --yes clang
      - name: Run native examples under UBSan
        run: cargo test --manifest-path compiler/Cargo.toml --test examples -- --test-threads=1
