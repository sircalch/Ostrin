name: Ostrin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate pages, links and playground wiring
        run: node scripts/website-check.mjs
      - name: Validate release and installer contracts
        run: node scripts/distribution-check.mjs

  compiler:
    name: Compiler tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The native backend needs a C compiler; fail loudly instead of skipping.
      OSTRIN_REQUIRE_CC: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --manifest-path compiler/Cargo.toml
