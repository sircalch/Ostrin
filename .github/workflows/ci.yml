name: Ostrin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    name: Website and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Build and verify the website/playground
        uses: ./.github/actions/website-verify

  compiler:
    name: Compiler tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The native backend needs a C compiler; fail loudly instead of skipping.
      OSTRIN_REQUIRE_CC: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --manifest-path compiler/Cargo.toml -- -A clippy::all -D clippy::suspicious
      - name: Run tests
        run: cargo test --manifest-path compiler/Cargo.toml
      - name: Run generated differential corpus
        env:
          # Exercise both deterministic generators with a wider corpus than
          # the default local smoke run, on every supported host.
          OSTRIN_FUZZ_SEEDS: "8"
        run: cargo test --manifest-path compiler/Cargo.toml --test examples generated_ -- --test-threads=1
      - name: Set up Node.js for scientific validation tooling
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate numerical algorithms with residuals
        run: node scripts/numeric-validation.mjs > numeric-validation-report.json
      - name: Test numerical validation tolerances
        run: node --test scripts/numeric-validation.test.mjs
      - name: Upload numerical validation report
        uses: actions/upload-artifact@v4
        with:
          name: numeric-validation-${{ matrix.os }}
          path: numeric-validation-report.json
          if-no-files-found: error
