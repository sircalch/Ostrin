name: Build Ostrin WASI compiler

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  wasi:
    name: ostrinc wasm32-wasip1
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "34.0"
      WASI_SDK_SHA256: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust with WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install pinned WASI C toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/$archive"
          printf '%s  %s\n' "$WASI_SDK_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive"
          sdk="$PWD/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          echo "OSTRIN_WASI_CC=$sdk/bin/clang" >> "$GITHUB_ENV"
          echo "OSTRIN_WASI_SYSROOT=$sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Build release compiler
        run: cargo build --manifest-path compiler/Cargo.toml --target wasm32-wasip1 --release

      - name: Build host compiler for the program matrix
        run: cargo build --manifest-path compiler/Cargo.toml --release

      - name: Smoke test compiler under Node WASI
        shell: bash
        env:
          NODE_NO_WARNINGS: "1"
        run: |
          node --input-type=module <<'NODE'
          import { WASI } from 'node:wasi';
          import { readFileSync } from 'node:fs';

          const wasi = new WASI({
            version: 'preview1',
            args: ['ostrinc', '--check', 'examples/hello.ostrin'],
            preopens: { '.': process.cwd() },
            returnOnExit: true,
          });
          const module = await WebAssembly.compile(
            readFileSync('compiler/target/wasm32-wasip1/release/ostrinc.wasm'),
          );
          const instance = await WebAssembly.instantiate(module, wasi.getImportObject());
          const exitCode = wasi.start(instance);
          if (exitCode !== 0) process.exit(exitCode);
          NODE

      - name: Compile and smoke-test the WASI program matrix
        env:
          NODE_NO_WARNINGS: "1"
        run: node scripts/wasi-program-check.mjs

      - name: Package and checksum artifact
        shell: bash
        run: |
          mkdir -p dist
          cp compiler/target/wasm32-wasip1/release/ostrinc.wasm dist/ostrinc.wasm
          printf '%s\n' 'Ostrin WASI distribution' 'compiler = ostrinc.wasm' 'program smoke tests = hello.wasm, pkg_project.wasm, wasi_io_contract.wasm, native_ir_file_io.wasm, native_ir_managed_consumers.wasm, native_ir_nested_wrappers.wasm, native_ir_function_values.wasm' 'target = wasm32-wasip1' 'runner = WASI Preview 1 host with WebAssembly exception handling' > dist/README.txt
          sha256sum dist/ostrinc.wasm dist/hello.wasm dist/pkg_project.wasm dist/wasi_io_contract.wasm dist/native_ir_file_io.wasm dist/native_ir_managed_consumers.wasm dist/native_ir_nested_wrappers.wasm dist/native_ir_function_values.wasm > dist/SHA256SUMS
          tar -czf ostrinc-wasm32-wasip1.tar.gz -C dist ostrinc.wasm hello.wasm pkg_project.wasm wasi_io_contract.wasm native_ir_file_io.wasm native_ir_managed_consumers.wasm native_ir_nested_wrappers.wasm native_ir_function_values.wasm SHA256SUMS README.txt

      - name: Upload WASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostrinc-wasm32-wasip1
          path: ostrinc-wasm32-wasip1.tar.gz
