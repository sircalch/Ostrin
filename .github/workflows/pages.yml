name: Deploy Ostrin website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'compiler/**'
      - 'scripts/website-check.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust with the WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Build the compiler to WebAssembly for the playground
        run: |
          cargo build --manifest-path compiler/Cargo.toml --target wasm32-wasip1 --release
          cp compiler/target/wasm32-wasip1/release/ostrinc.wasm website/ostrinc.wasm
      - name: Validate website and WASM artifact
        run: node scripts/website-check.mjs --wasm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
