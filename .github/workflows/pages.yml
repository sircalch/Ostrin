name: Deploy Ostrin website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'compiler/**'
      - 'scripts/provenance-page.mjs'
      - 'scripts/quality-scorecard.mjs'
      - 'scripts/status-page.mjs'
      - 'scripts/experiment-bundle.mjs'
      - 'scripts/r3-readiness.mjs'
      - 'docs/r3-readiness.md'
      - 'validation/**'
      - 'scripts/website-check.mjs'
      - 'tests/browser/**'
      - '.github/actions/website-verify/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build and verify the website/playground
        uses: ./.github/actions/website-verify
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
