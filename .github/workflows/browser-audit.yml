name: Browser audit

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'compiler/**'
      - 'scripts/**'
      - 'tests/browser/**'
      - '.github/actions/website-verify/**'
      - '.github/workflows/browser-audit.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'compiler/**'
      - 'scripts/**'
      - 'tests/browser/**'
      - '.github/actions/website-verify/**'
      - '.github/workflows/browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify static site and all browser engines
        uses: ./.github/actions/website-verify
